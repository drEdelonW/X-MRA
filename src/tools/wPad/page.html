R"HTML(
<!DOCTYPE html>
<html>
  <head><meta charset='utf-8'><title>Web Control</title>
    <style>
      #hud {
        position: absolute;
        top: 1rem;
        right: 1rem;
        max-width: 55vw;
        max-height: 90vh;
        padding: 1rem;
        background-color: rgba(32, 32, 32, 0.6);
        color: white;
        border-radius: 0.5rem;
        overflow-y: auto;
        font-family: sans-serif;
      }

      .slider-row {
        display: flex;
        align-items: center;
        margin: 0.25rem 0;
      }

      .slider-row span {
        margin-left: 0.5rem;
        min-width: 3em;
        text-align: right;
      }

      .checkboxes {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .checkboxes label {
        width: 3.5rem;
      }

      #touch-controls {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 10;
        pointer-events: none;
      }

      .touch-stick {
        position: absolute;
        bottom: 15%;
        width: 25vw;
        height: 25vw;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        pointer-events: auto;
        touch-action: none;
      }

      #touch-left { left: 5%; }
      #touch-right { right: 5%; }

      .touch-btn {
        position: absolute;
        bottom: 10%;
        width: 10vw;
        height: 10vw;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid white;
        font-size: 1.5em;
        color: white;
        pointer-events: auto;
        touch-action: manipulation;
      }

      #touch-A { right: 20%; }
      #touch-B { right: 8%; }

    </style>

  </head>
  <body>
    <img id="bg" style="
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    " />
    <script>
      const host = location.hostname;
      const port = 8081;
      const stream = `http://${host}:${port}`;
      document.getElementById("bg").src = stream;
    </script>
    <h3>Clicks: <span id='cnt'>-1</span></h3>
    <button id='btn'>ADD</button>
    <button id='btnn'>SUB</button>

    <div id="hud">
      <hr>
      <div>
        <label>Slider 1: <input type="range" id="s1" min="0" max="1" step="0.01" value="0.5"></label>
        <span id="v1">0.5</span>
        <br>
        <label>Slider 2: <input type="range" id="s2" min="0" max="1" step="0.01" value="0.5"></label>
        <span id="v2">0.5</span>
        <br>
        <label>Slider 3: <input type="range" id="s3" min="0" max="1" step="0.01" value="0.5"></label>
        <span id="v3">0.5</span>
        <br>
        <label>Slider 4: <input type="range" id="s4" min="0" max="1" step="0.01" value="0.5"></label>
        <span id="v4">0.5</span>
        <br>
        <label>Slider 5: <input type="range" id="s5" min="0" max="1" step="0.01" value="0.5"></label>
        <span id="v5">0.5</span>
        <br>
        <label>Slider 6: <input type="range" id="s6" min="0" max="1" step="0.01" value="0.5"></label>
        <span id="v6">0.5</span>
      </div>

      <hr>
      <div>
        Checkboxes:<br>
        <label><input type="checkbox" class="cb" id="cb0">0</label>
        <label><input type="checkbox" class="cb" id="cb1">1</label>
        <label><input type="checkbox" class="cb" id="cb2">2</label>
        <label><input type="checkbox" class="cb" id="cb3">3</label>
        <label><input type="checkbox" class="cb" id="cb4">4</label>
        <label><input type="checkbox" class="cb" id="cb5">5</label>
        <label><input type="checkbox" class="cb" id="cb6">6</label>
        <label><input type="checkbox" class="cb" id="cb7">7</label><br>
        <label><input type="checkbox" class="cb" id="cb8">8</label>
        <label><input type="checkbox" class="cb" id="cb9">9</label>
        <label><input type="checkbox" class="cb" id="cb10">A</label>
        <label><input type="checkbox" class="cb" id="cb11">B</label>
        <label><input type="checkbox" class="cb" id="cb12">C</label>
        <label><input type="checkbox" class="cb" id="cb13">D</label>
        <label><input type="checkbox" class="cb" id="cb14">E</label>
        <label><input type="checkbox" class="cb" id="cb15">F</label>
      </div>
    </div>

    <script>
      let cnt = 13;
      const span = document.getElementById('cnt');
      document.getElementById('btn').onclick = () => {
        span.textContent = ++cnt;
        fetch('/ping', {
          method: 'POST',
          headers: {'Content-Type': 'text/plain'},
          body: String(cnt)
        });
      };
      document.getElementById('btnn').onclick = () => {
        span.textContent = --cnt;
        fetch('/ping', {
          method: 'POST',
          headers: {'Content-Type': 'text/plain'},
          body: String(cnt)
        });
      };

      const s1 = document.getElementById('s1');
      const s2 = document.getElementById('s2');
      const s3 = document.getElementById('s3');
      const s4 = document.getElementById('s4');
      const s5 = document.getElementById('s5');
      const s6 = document.getElementById('s6');

      let inFlight = false;
      let lastSendTime = 0;
      const MIN_SEND_INTERVAL_MS = 16;

      function queueSend() {
        const now = performance.now();
        if (inFlight || (now - lastSendTime) < MIN_SEND_INTERVAL_MS) {
          return;
        }

        inFlight = true;
        lastSendTime = now;

        const buf = new ArrayBuffer(26);
        const dv = new DataView(buf);
        dv.setFloat32(0,  parseFloat(s1.value), true);
        dv.setFloat32(4,  parseFloat(s2.value), true);
        dv.setFloat32(8,  parseFloat(s3.value), true);
        dv.setFloat32(12, parseFloat(s4.value), true);
        dv.setFloat32(16, parseFloat(s5.value), true);
        dv.setFloat32(20, parseFloat(s6.value), true);

        let flags = 0;
        for (let i = 0; i < 16; ++i)
          if (document.getElementById('cb' + i).checked)
            flags |= (1 << i);
        dv.setUint16(24, flags);

        fetch('/raw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: buf
        }).finally(() => {
          inFlight = false;
        });
      }
      s1.oninput = () => {
        document.getElementById('v1').textContent = s1.value;
        queueSend();
      };
      s2.oninput = () => {
        document.getElementById('v2').textContent = s2.value;
        queueSend();
      };
      s3.oninput = () => {
        document.getElementById('v3').textContent = s3.value;
        queueSend();
      };
      s4.oninput = () => {
        document.getElementById('v4').textContent = s4.value;
        queueSend();
      };
      s5.oninput = () => {
        document.getElementById('v5').textContent = s5.value;
        queueSend();
      };
      s6.oninput = () => {
        document.getElementById('v6').textContent = s6.value;
        queueSend();
      };
      document.querySelectorAll('.cb').forEach(cb => {
        cb.onchange = queueSend;
      });
      let gamepadIndex = null;

      function pollGamepad() {
        const gamepads = navigator.getGamepads();
        const gp = gamepads[gamepadIndex];
        if (!gp) return;

        s1.value = (gp.axes[0] + 1) / 2;
        s2.value = (gp.axes[1] + 1) / 2;
        s3.value = (gp.axes[2] + 1) / 2;
        s4.value = (gp.axes[3] + 1) / 2;
        s5.value = gp.buttons[6]?.value || 0;
        s6.value = gp.buttons[7]?.value || 0;

        document.getElementById('v1').textContent = s1.value;
        document.getElementById('v2').textContent = s2.value;
        document.getElementById('v3').textContent = s3.value;
        document.getElementById('v4').textContent = s4.value;
        document.getElementById('v5').textContent = s5.value;
        document.getElementById('v6').textContent = s6.value;

        for (let i = 0; i < 16; ++i) {
          const cb = document.getElementById('cb' + i);
          if (cb) cb.checked = gp.buttons[i]?.pressed;
        }

        queueSend();
      }

      function gamepadLoop() {
        if (gamepadIndex !== null) pollGamepad();
        requestAnimationFrame(gamepadLoop);
      }

      window.addEventListener("gamepadconnected", (e) => {
        gamepadIndex = e.gamepad.index;
        console.log("Gamepad connected:", e.gamepad);
      });

      window.addEventListener("gamepaddisconnected", () => {
        gamepadIndex = null;
        console.log("Gamepad disconnected");
      });

      requestAnimationFrame(gamepadLoop);



      let keys = {};
      let mouseX = 0, mouseY = 0;

      window.addEventListener("keydown", e => {
        keys[e.code] = true;
      });

      window.addEventListener("keyup", e => {
        keys[e.code] = false;
      });

      document.getElementById("bg").addEventListener("click", () => {
        if (document.pointerLockElement !== document.body) {
          document.body.requestPointerLock();
        }
      });

      document.addEventListener("pointerlockchange", () => {
        if (document.pointerLockElement !== document.body) {
          mouseX = 0;
          mouseY = 0;
        }
      });

      document.addEventListener("mousemove", e => {
        if (document.pointerLockElement === document.body) {
          mouseX += e.movementX;
          mouseY += e.movementY;
        }
      });

      function pollKeyboardAndMouse() {
        if (gamepadIndex !== null) return; // skip if gamepad active
        if (document.pointerLockElement !== document.body) return; // skip if not in capture mode

        const scale = keys["ShiftLeft"] || keys["ShiftRight"] ? 1.0 : 0.5;
        const moveX = (keys["KeyD"] ? 1 : 0) - (keys["KeyA"] ? 1 : 0);
        const moveY = (keys["KeyS"] ? 1 : 0) - (keys["KeyW"] ? 1 : 0);

        const axisLx = (moveX * scale + 1) / 2;
        const axisLy = (moveY * scale + 1) / 2;

        const mouseScale = 0.002;
        const axisRx = Math.max(0, Math.min(1, (mouseX * mouseScale + 1) / 2));
        const axisRy = Math.max(0, Math.min(1, (mouseY * mouseScale + 1) / 2));

        s1.value = axisLx.toFixed(3);
        s2.value = axisLy.toFixed(3);
        s3.value = axisRx.toFixed(3);
        s4.value = axisRy.toFixed(3);
        s5.value = (keys["ControlLeft"] || keys["ControlRight"]) ? 1.0 : 0.0;
        s6.value = keys["Space"] ? 1.0 : 0.0;

        document.getElementById("v1").textContent = s1.value;
        document.getElementById("v2").textContent = s2.value;
        document.getElementById("v3").textContent = s3.value;
        document.getElementById("v4").textContent = s4.value;
        document.getElementById("v5").textContent = s5.value;
        document.getElementById("v6").textContent = s6.value;

        console.log(`[KEYBOARD] WASD=(${moveX},${moveY}) Mouse=(${mouseX},${mouseY})`);

        queueSend();

        mouseX = 0;
        mouseY = 0;
      }


      function inputLoop() {
        if (gamepadIndex === null && document.pointerLockElement === document.body) {
          pollKeyboardAndMouse();
        }
        requestAnimationFrame(inputLoop);
      }

      inputLoop();

      function isTouchDevice() {
        return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      }

      function enableTouchUI() {
        if (document.fullscreenEnabled && !document.fullscreenElement) {
          document.body.requestFullscreen().catch(err => {
            console.warn("Fullscreen failed:", err);
          });
        }

        const overlay = document.createElement("div");
        overlay.id = "touch-controls";
        overlay.innerHTML = `
          <div id="touch-left" class="touch-stick"></div>
          <div id="touch-right" class="touch-stick"></div>
          <button id="touch-A" class="touch-btn">A</button>
          <button id="touch-B" class="touch-btn">B</button>
        `;
        document.body.appendChild(overlay);
        setupTouchControls();
        startNoSleep();
      }

      window.addEventListener("load", () => {
        if (isTouchDevice() && !navigator.getGamepads()[0]) {
          enableTouchUI();
        }
      });


      function setupTouchControls() {
        let lx = 0, ly = 0, rx = 0, ry = 0;
        let aBtn = false, bBtn = false;

        function updateTouchState() {
          s1.value = ((lx / 50) + 1) / 2;
          s2.value = ((ly / 50) + 1) / 2;
          s3.value = ((rx / 50) + 1) / 2;
          s4.value = ((ry / 50) + 1) / 2;
          s5.value = aBtn ? 1.0 : 0.0;
          s6.value = bBtn ? 1.0 : 0.0;

          v1.textContent = s1.value;
          v2.textContent = s2.value;
          v3.textContent = s3.value;
          v4.textContent = s4.value;
          v5.textContent = s5.value;
          v6.textContent = s6.value;

          queueSend();
        }

        function stickListener(el, callback) {
          let startX = 0, startY = 0;
          el.addEventListener("touchstart", e => {
            const t = e.touches[0];
            startX = t.clientX;
            startY = t.clientY;
            e.preventDefault();
          });
          el.addEventListener("touchmove", e => {
            const t = e.touches[0];
            const dx = t.clientX - startX;
            const dy = t.clientY - startY;
            callback(dx, dy);
            e.preventDefault();
          });
          el.addEventListener("touchend", () => {
            callback(0, 0);
          });
        }

        stickListener(document.getElementById("touch-left"), (x, y) => {
          lx = Math.max(-50, Math.min(50, x));
          ly = Math.max(-50, Math.min(50, y));
          updateTouchState();
        });

        stickListener(document.getElementById("touch-right"), (x, y) => {
          rx = Math.max(-50, Math.min(50, x));
          ry = Math.max(-50, Math.min(50, y));
          updateTouchState();
        });

        document.getElementById("touch-A").addEventListener("touchstart", () => { aBtn = true; updateTouchState(); });
        document.getElementById("touch-A").addEventListener("touchend", () => { aBtn = false; updateTouchState(); });
        document.getElementById("touch-B").addEventListener("touchstart", () => { bBtn = true; updateTouchState(); });
        document.getElementById("touch-B").addEventListener("touchend", () => { bBtn = false; updateTouchState(); });
      }

      function startNoSleep() {
        let wakeLock = null;

        async function requestWakeLock() {
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
              console.log('Screen Wake Lock released');
            });
          } catch (err) {
            console.error(`${err.name}, ${err.message}`);
          }
        }

        if ('wakeLock' in navigator) {
          requestWakeLock();
          document.addEventListener("visibilitychange", () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
              requestWakeLock();
            }
          });
        } else {
          console.warn("Wake Lock API not supported.");
        }
      }

    </script>
  </body>
</html>
)HTML"
