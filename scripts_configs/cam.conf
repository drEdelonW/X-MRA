# ── устройство ───────────────────────────────────────────
video_device      /dev/video0
width             640
height            480
rotate            180

# ── поток ────────────────────────────────────────────────
framerate         30
stream_maxrate    30
stream_port       8081
stream_localhost  off

# ── V4L2-контролы без регулировки яркости ───────────────
video_params      "pix_format=YUYV;exposure_auto=1;gain_auto=0"
#    ↳ если экспозицию/усиление тоже хотите вернуть на авто-режим,
#      уберите их из списка или задайте exposure_auto=3, gain_auto=1

# ── отключаем детекцию движения «по старому» способу ─────
emulate_motion    off
threshold         15000      # чтобы Motion не создавал лишние events

# ── файловый вывод не нужен ──────────────────────────────
picture_output    off
movie_output      off